version: 2

sources:
  - name: raw
    description: Untouched copies of nflverse data, loaded by `python -m ingest`.
    schema: raw
    tables:
      - name: pbp
        description: >
          nflfastR play-by-play: one row per event (plays, but also timeouts, quarter ends,
          two-minute warnings). ~372 columns. Only games the schedule marks final are loaded.
      - name: schedules
        description: Every game 1999-present including upcoming ones. Replaced in full each run.
      - name: rosters
        description: Season-level roster snapshots. The current season is re-pulled each run.
      - name: ftn_charting
        description: >
          FTN Data's hand charting (2022+): play-action, motion, RPO, screens, box counts. One row
          per play. License CC-BY-SA 4.0: credit "FTN Data via nflverse" wherever it is shown.
      - name: participation
        description: >
          Per-play personnel and formation (2016-2025; the NFL no longer publishes it for the
          current season). One row per play.
      - name: teams
        description: Team abbreviations, franchise ids, colors and logos.
      - name: pbp_unavailable_games
        description: >
          Final games that nflverse's play-by-play doesn't contain (three 1999-2000 games), as
          recorded by the ingest the last time it downloaded that season.

  - name: ml
    description: Model outputs written by `python -m models.score` (Phase 2). Read by the `scored` dbt models.
    schema: ml
    tables:
      - name: fourth_down_options
        description: WP of go / punt / FG for every regulation 4th-down decision, plus their ingredients.
      - name: play_wp
        description: This project's WP model output before every regulation scrimmage play.
