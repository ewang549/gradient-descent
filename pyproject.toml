[project]
name = "nfl-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "matplotlib>=3.11.2",
    "nflreadpy>=0.1.5",
    "onnx>=1.23.2",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.31.1",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pyreadr>=0.5.9",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
