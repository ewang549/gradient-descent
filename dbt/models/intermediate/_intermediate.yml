version: 2

models:
  - name: int_team_game_epa
    description: One row per team per played game with offensive/defensive EPA totals.
    columns:
      - name: team_game_uid
        data_tests: [unique, not_null]
      - name: off_plays
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

  - name: int_team_strength
    description: Pre-game rolling team strength. Every window ends at `1 preceding` (prior games only).
    columns:
      - name: team_game_uid
        data_tests: [unique, not_null]
      - name: games_in_last_8
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 8
