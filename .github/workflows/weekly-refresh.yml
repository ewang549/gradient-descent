name: weekly-refresh

on:
  schedule:
    - cron: "0 12 * * 2"  # Tuesdays 12:00 UTC (7-8am ET), after Monday Night Football
  workflow_dispatch: {}    # adds a "Run workflow" button for manual runs

permissions:
  contents: write  # commits the new exports back to the repo

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes no floating major tag (v10 does not resolve)
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Restore last week's warehouse so the ingest only fetches new games. Correctness never
      # depends on this cache: on a miss (first run, or GitHub evicted it) the ingest simply
      # backfills every season, which takes a few minutes.
      - name: Restore DuckDB warehouse
        uses: actions/cache@v6
        with:
          path: data/nfl.duckdb
          key: warehouse-${{ github.run_id }}
          restore-keys: warehouse-

      - run: uv sync --frozen
      - run: cd dbt && uv run dbt deps
      - run: cd web && npm ci

      # Commit as the repo owner (GitHub noreply address). Vercel only deploys commits whose author
      # owns the Vercel account (Hobby) or is on the team (Pro), and a push IS the deploy trigger.
      - name: Configure the commit author
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"

      # Fails (and stops the job before anything is committed) if the engine's sanity situations
      # fail: models.score refuses to write scores.
      - run: make refresh

      # Finding 2: once the 2026 regular season is over, grade the timestamped predictions by the rules
      # written into each file and draw the results card. A no-op until then, and grades are written
      # once. It runs before the weekly gate and commits only its own folder, so a postseason week
      # that fails the gate can't hold the grades back.
      - name: Grade the 2026 luck vs skill predictions
        run: |
          make grade
          git add exports/findings/luck-skill
          if git diff --cached --quiet; then echo "Nothing to grade yet."; exit 0; fi
          git commit -m "data: grade the 2026 luck vs skill predictions" -m "Automated by the weekly-refresh workflow."
          git push

      # The publish gate runs first inside `make weekly`: sanity situations again, and every
      # scheduled game of the latest week must be final with play-by-play and graded 4th downs.
      # Then: weekly JSON, the latest week's cards and draft posts (posts that break the rules fail here).
      - run: make weekly

      # This push IS the deploy trigger (author set above).
      - name: Commit exports
        id: commit
        run: |
          git add exports
          if git diff --cached --quiet; then
            echo "No new exports; nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read SEASON WEEK < <(python3 -c "import json; m=json.load(open('exports/meta.json'))['data_through']; print(m['season'], m['week'])")
          git commit -m "data: weekly refresh through ${SEASON} week ${WEEK}" -m "Automated by the weekly-refresh workflow."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "season=${SEASON}" >> "$GITHUB_OUTPUT"
          echo "week=${WEEK}" >> "$GITHUB_OUTPUT"
          echo "card=cards/${SEASON}/week_$(printf %02d "$WEEK")/worst-call.png" >> "$GITHUB_OUTPUT"

      # Vercel's GitHub integration deploys the push above. Wait until the new week's card is live,
      # so a failed or blocked deploy fails this run (and GitHub emails you) instead of passing quietly.
      - name: Wait for the Vercel deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          CARD: ${{ steps.commit.outputs.card }}
        run: |
          SITE_URL=$(python3 -c "import json; print(json.load(open('web/site.json'))['url'].rstrip('/'))")
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null "$SITE_URL/$CARD"; then echo "Live: $SITE_URL/$CARD"; exit 0; fi
            sleep 15
          done
          echo "::error::$SITE_URL/$CARD not live after 10 minutes. Check the deployment in the Vercel dashboard."
          exit 1

      # Only reached when the deploy above went live (any failed step stops the job first, including the
      # publish gate inside `make weekly`). Posts the worst-call card, then the leaderboard card as a reply.
      # DRY RUN unless the X_POST_ENABLED secret is "true": then it only writes the posts to the run summary.
      # The rules (no links or @mentions, max 1 hashtag, max 3 posts, gate re-checked, never the same week
      # twice) live in models/x_post.py. Setup: docs/x_setup.md.
      - name: Post to X
        id: post
        if: steps.commit.outputs.changed == 'true'
        env:
          X_POST_ENABLED: ${{ secrets.X_POST_ENABLED }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: uv run python -m models.x_post ${{ steps.commit.outputs.season }} ${{ steps.commit.outputs.week }}

      # Commit the posted log even if posting failed halfway, so a retry can't post the same week twice.
      # (Dry runs write no log, so this is a no-op until posting is enabled.)
      - name: Commit the posted log
        if: always() && steps.post.outcome != 'skipped'
        run: |
          git add exports/social
          if git diff --cached --quiet; then echo "No posts logged."; exit 0; fi
          git commit -m "data: log X posts for week ${{ steps.commit.outputs.week }}" -m "Automated by the weekly-refresh workflow."
          git push
